<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>

  <title>Frontend Mentor | Contact form</title>
</head>
<body>
  <main>
      <form>
        <h1>Contact Us</h1>
      
        <div id="name-row">
        <label for="firstname">First Name: *</label>
        <input type="text" id="firstname" name="firstname" required>
        <label for="lastname">Last Name: *</label>
        <input type="text" id="lastname" name="lastname" required>
        </div>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>

        <label>Query Type *</label>
        <fieldset id="query-type">
          <input type="radio" id="general" name="query" value="General Enquiry" required>
          <label for="general">General Enquiry</label>
          <input type="radio" id="support" name="query" value="Support Request">
          <label for="support">Support Request</label>
        </fieldset>      

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="5" cols="30" required maxlength="1000"></textarea>

        <input id="consent" name="consent" type="checkbox" required>
        <label for="consent">I consent to being contacted by the team *</label>

        <button type="submit">Submit</button>
      </form>
  </main>
