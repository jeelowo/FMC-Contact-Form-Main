<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>

  <title>Frontend Mentor | Contact form</title>
</head>
<body>
  <main>
    <h1>Contact Us</h1>
      <form>
        <div class="grid">
          <div class="input-div">
            <label for="firstname">First Name: <span class="asterisk">*</span></label>
            <input type="text" id="firstname" name="firstname" required>
            <p id="first-name-error" aria-live="polite" hidden>This field is required</p>
          </div>

          <div class="input-div">
            <label for="lastname">Last Name: <span class="asterisk">*</span></label>
            <input type="text" id="lastname" name="lastname" required>
            <p id="last-name-error" aria-live="polite" hidden>This field is required.</p>
          </div>
        </div>

        <div class="input-div">
          <label for="email">Email Address <span class="asterisk">*</span></label>
          <input type="email" id="email" name="email" required>
          <p id="email-error" aria-live="polite" hidden>Please enter a valid email address.</p>
        </div>

        <fieldset class="query-div">
          <legend class="main-label">Query Type <span class="asterisk">*</span></legend>
          <div class="grid">
            <label for="general" class="radio-div">
              <input type="radio" id="general" name="query" value="General Enquiry" required>
              <span>General Enquiry</span>
            </label>

            <label for="support" class="radio-div">
              <input type="radio" id="support" name="query" value="Support Request">
              <span>Support Request</span>
            </label>
          </div>

          <p id="query-error" aria-live="polite" hidden>Please select a query type.</p>
        </fieldset>
        
        <div>
          <label for="message">Message <span class="asterisk">*</span></label>
          <textarea id="message" name="message" rows="5" cols="30" maxlength="1000" required></textarea>
          <p id="message-error" aria-live="polite" hidden>This field is required.</p>
        </div>

        <div id="consent-div" class="input-div">
          <input id="consent" name="consent" type="checkbox" required>
          <label for="consent">I consent to being contacted by the team <span class="asterisk">*</span></label>
          <p id="consent-error" aria-live="polite" hidden>  To submit this form, please consent to being contacted.</p>
        </div>

        <button type="submit">Submit</button>
      </form>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">John Lemuel Plegaria</a>.
  </footer>
</body>
</html>
